spring.application.name=bancoxyz

# Oracle Autonomous Database (mTLS con wallet)
# Exporta las variables o crea application-local.properties (gitignored).
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS}?TNS_ADMIN=${ORACLE_WALLET_DIR}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# schema.sql crea las tablas de negocio; continue-on-error evita fallar si ya existen
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Primera ejecucion contra Oracle: always. Luego puedes cambiarlo a never.
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=true

bancoxyz.archivo-cuentas-anuales=classpath:data/cuentas_anuales.csv
bancoxyz.archivo-intereses=classpath:data/intereses.csv
bancoxyz.archivo-transacciones=classpath:data/transacciones.csv

logging.level.org.springframework.batch=INFO
logging.level.com.duoc.bancoxyz=DEBUG
